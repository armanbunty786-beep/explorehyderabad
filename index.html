<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Safety - Share Location</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#111827,#1e3a8a);
  display:flex;align-items:center;justify-content:center;
  padding:20px;color:#fff
}
.card{
  width:100%;max-width:420px;background:rgba(255,255,255,.1);
  backdrop-filter:blur(15px);border-radius:24px;padding:35px 25px;
  text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)
}
.play{
  width:85px;height:85px;margin:0 auto 25px;border-radius:50%;
  background:#ef4444;display:flex;align-items:center;justify-content:center;
  font-size:38px;box-shadow:0 10px 30px rgba(239,68,68,.4)
}
h1{font-size:30px;margin-bottom:12px}
p{color:#d1d5db;line-height:1.6;margin-bottom:25px}
button{
  width:100%;border:0;border-radius:14px;padding:17px;font-size:18px;
  font-weight:bold;cursor:pointer;background:#ef4444;color:#fff
}
button:hover{background:#dc2626}
.consent{
  display:none;margin-top:25px;padding:20px;background:rgba(0,0,0,.25);
  border-radius:15px
}
.consent p{font-size:14px;margin-bottom:18px}
.secondary{background:transparent;border:1px solid rgba(255,255,255,.3);margin-top:10px}
#status{margin-top:20px;font-size:14px;color:#d1d5db;word-break:break-word}
</style>
</head>
<body>
<div class="card">
  <div class="play">📍</div>
  <h1>Share Your Location</h1>
  <p>For family safety, you can choose to share your current device location.</p>

  <button id="watchButton">CONTINUE</button>

  <div class="consent" id="consentBox">
    <p>
      This page will request your device's current location.
      Your browser will show a permission prompt. Your location is shared only if you choose Allow.
    </p>
    <button id="allowButton">ALLOW &amp; SHARE LOCATION</button>
    <button class="secondary" id="cancelButton">CANCEL</button>
  </div>

  <div id="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
/*
 * EMAIL SETUP
 * -----------------------------------------
 * 1. Create a free account at https://www.emailjs.com/
 * 2. Create an Email Service.
 * 3. Create an Email Template.
 * 4. Replace the three values below with your EmailJS values.
 *
 * The browser asks for location permission first.
 * No location is collected or emailed if the person denies permission.
 */

const EMAILJS_PUBLIC_KEY = "o9RLx3513EpZtc-dX";
const EMAILJS_SERVICE_ID = "service_m1nrhud";
const EMAILJS_TEMPLATE_ID = "template_tdf3dxu";

const watchButton = document.getElementById("watchButton");
const consentBox = document.getElementById("consentBox");
const allowButton = document.getElementById("allowButton");
const cancelButton = document.getElementById("cancelButton");
const status = document.getElementById("status");

emailjs.init({
  publicKey: EMAILJS_PUBLIC_KEY
});

watchButton.addEventListener("click", () => {
  consentBox.style.display = "block";
  watchButton.style.display = "none";
});

cancelButton.addEventListener("click", () => {
  consentBox.style.display = "none";
  watchButton.style.display = "block";
  status.textContent = "";
});

allowButton.addEventListener("click", () => {
  if (!navigator.geolocation) {
    status.textContent = "Location services are not supported by this browser.";
    return;
  }

  allowButton.disabled = true;
  status.textContent = "Requesting location permission...";

  navigator.geolocation.getCurrentPosition(
    async (position) => {
      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const accuracy = position.coords.accuracy;
      const timestamp = new Date(position.timestamp).toLocaleString();

      const mapsLink =
        `https://www.google.com/maps?q=${latitude},${longitude}`;

      status.textContent = "Location permission granted. Sending location...";

      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          latitude: latitude.toFixed(6),
          longitude: longitude.toFixed(6),
          accuracy: `${Math.round(accuracy)} meters`,
          timestamp: timestamp,
          maps_link: mapsLink
        });

        status.textContent =
          "Location shared successfully. Thank you.";
      } catch (error) {
        console.error("EmailJS error:", error);
        status.textContent =
          "Location was obtained, but the email could not be sent.";
        allowButton.disabled = false;
      }
    },
    (error) => {
      allowButton.disabled = false;

      if (error.code === 1)
        status.textContent = "Location permission was denied.";
      else if (error.code === 2)
        status.textContent = "Location is currently unavailable.";
      else if (error.code === 3)
        status.textContent = "Location request timed out.";
      else
        status.textContent = "Unable to obtain location.";
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
});
</script>
</body>
</html>
